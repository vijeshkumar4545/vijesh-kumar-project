<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Unity Web Player | My project (7)</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    /* =========================================================
       GLOBAL
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #202a44 0%, transparent 35%),
        radial-gradient(circle at bottom right, #172033 0%, transparent 40%),
        #080b12;
      color: white;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================================================
       UNITY CONTAINER
    ========================================================= */

    #unity-container {
      position: relative;

      width: min(1200px, 94vw);
      height: min(760px, 92vh);

      display: flex;
      flex-direction: column;

      background: #0d111a;

      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.02);

      backdrop-filter: blur(10px);
    }

    /* =========================================================
       CANVAS
    ========================================================= */

    #unity-canvas {
      width: 100% !important;
      height: 100% !important;

      display: block;

      background: #000;

      outline: none;
    }

    /* =========================================================
       LOADING SCREEN
    ========================================================= */

    #unity-loading-bar {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: min(420px, 80%);

      padding: 28px 30px;

      background: rgba(12, 16, 25, 0.94);

      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 16px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45);

      z-index: 10;

      backdrop-filter: blur(12px);
    }

    #unity-logo {
      width: 100%;
      height: 55px;

      margin-bottom: 20px;

      background-image: url("TemplateData/unity-logo-dark.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 8px;

      overflow: hidden;

      background: rgba(255, 255, 255, 0.10);

      border-radius: 20px;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;

      border-radius: 20px;

      background: linear-gradient(
        90deg,
        #5b8cff,
        #8b5cf6
      );

      box-shadow:
        0 0 15px rgba(91, 140, 255, 0.45);

      transition: width 0.15s ease;
    }

    /* =========================================================
       WARNING / ERROR
    ========================================================= */

    #unity-warning {
      position: absolute;

      left: 50%;
      top: 20px;

      transform: translateX(-50%);

      width: min(700px, 90%);

      z-index: 20;

      text-align: center;

      pointer-events: none;
    }

    #unity-warning div {
      margin-bottom: 8px;

      padding: 12px 18px !important;

      border-radius: 10px !important;

      border: 1px solid rgba(255, 255, 255, 0.15);

      font-size: 14px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    #unity-footer {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 48px;

      display: flex;
      align-items: center;

      padding: 0 16px;

      background: rgba(7, 10, 16, 0.90);

      border-top: 1px solid rgba(255, 255, 255, 0.08);

      z-index: 5;

      backdrop-filter: blur(10px);
    }

    /* Hide default Unity logo title */
    #unity-logo-title-footer {
      display: none;
    }

    /* =========================================================
       GAME TITLE
    ========================================================= */

    #unity-build-title {
      flex: 1;

      font-size: 14px;
      font-weight: 600;

      color: rgba(255, 255, 255, 0.82);

      letter-spacing: 0.3px;
    }

    /* =========================================================
       FULLSCREEN BUTTON
    ========================================================= */

    #unity-fullscreen-button {
      width: 34px;
      height: 34px;

      border-radius: 9px;

      cursor: pointer;

      background:
        rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.10);

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        border-color 0.2s ease;

      position: relative;
    }

    #unity-fullscreen-button::before {
      content: "⛶";

      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -52%);

      font-size: 21px;

      color: white;
    }

    #unity-fullscreen-button:hover {
      background: rgba(91, 140, 255, 0.22);

      border-color: rgba(91, 140, 255, 0.45);

      transform: scale(1.05);
    }

    #unity-fullscreen-button:active {
      transform: scale(0.96);
    }

    /* =========================================================
       DESKTOP
    ========================================================= */

    .unity-desktop {
      width: min(1200px, 94vw);
      height: min(760px, 92vh);
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    .unity-mobile {
      width: 100% !important;
      height: 100% !important;

      border-radius: 0 !important;
      border: none !important;

      box-shadow: none !important;
    }

    .unity-mobile #unity-canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .unity-mobile #unity-footer {
      display: none;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 800px) {

      #unity-container {
        width: 96vw;
        height: 88vh;

        border-radius: 14px;
      }

      #unity-loading-bar {
        width: 80%;
        padding: 22px;
      }

      #unity-footer {
        height: 44px;
      }
    }

    @media (max-width: 500px) {

      #unity-container {
        width: 100vw;
        height: 100vh;

        border-radius: 0;
        border: none;
      }

      #unity-loading-bar {
        width: 85%;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       UNITY GAME CONTAINER
  ========================================================= -->

  <div id="unity-container" class="unity-desktop">

    <canvas
      id="unity-canvas"
      width="960"
      height="600"
      tabindex="-1">
    </canvas>

    <!-- =======================================================
         LOADING BAR
    ======================================================= -->

    <div id="unity-loading-bar">

      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>

    </div>

    <!-- =======================================================
         WARNING
    ======================================================= -->

    <div id="unity-warning"></div>

    <!-- =======================================================
         FOOTER
    ======================================================= -->

    <div id="unity-footer">

      <div id="unity-logo-title-footer"></div>

      <div id="unity-fullscreen-button"></div>

      <div id="unity-build-title">
        My project (7)
      </div>

    </div>

  </div>


  <script>

    /* =========================================================
       CANVAS
    ========================================================= */

    var canvas = document.querySelector("#unity-canvas");


    /* =========================================================
       WARNING BANNER
    ========================================================= */

    function unityShowBanner(msg, type) {

      var warningBanner =
        document.querySelector("#unity-warning");

      function updateBannerVisibility() {

        warningBanner.style.display =
          warningBanner.children.length
            ? "block"
            : "none";
      }

      var div = document.createElement("div");

      div.innerHTML = msg;

      warningBanner.appendChild(div);

      if (type == "error") {

        div.style =
          "background: #dc2626; padding: 10px; color: white;";

      } else {

        if (type == "warning") {

          div.style =
            "background: #f59e0b; padding: 10px; color: #111827;";
        }

        setTimeout(function () {

          if (warningBanner.contains(div)) {

            warningBanner.removeChild(div);

            updateBannerVisibility();
          }

        }, 5000);
      }

      updateBannerVisibility();
    }


    /* =========================================================
       UNITY BUILD CONFIGURATION
       IMPORTANT:
       PATHS ARE UNCHANGED
    ========================================================= */

    var buildUrl = "Build";

    var loaderUrl =
      buildUrl + "/web.loader.js";

    var config = {

      arguments: [],

      dataUrl:
        buildUrl + "/web.data",

      frameworkUrl:
        buildUrl + "/web.framework.js",

      codeUrl:
        buildUrl + "/web.wasm",

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "DefaultCompany",

      productName:
        "My project (7)",

      productVersion:
        "0.1.0",

      showBanner:
        unityShowBanner
    };


    /* =========================================================
       MOBILE DETECTION
    ========================================================= */

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

      var meta =
        document.createElement("meta");

      meta.name = "viewport";

      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

      document
        .getElementsByTagName("head")[0]
        .appendChild(meta);

      document
        .querySelector("#unity-container")
        .className = "unity-mobile";

      canvas.className =
        "unity-mobile";

    } else {

      /* Desktop */

      canvas.style.width = "960px";

      canvas.style.height = "600px";
    }


    /* =========================================================
       SHOW LOADING BAR
    ========================================================= */

    document
      .querySelector("#unity-loading-bar")
      .style.display = "block";


    /* =========================================================
       LOAD UNITY
    ========================================================= */

    var script =
      document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {

      createUnityInstance(
        canvas,
        config,

        (progress) => {

          document
            .querySelector("#unity-progress-bar-full")
            .style.width =
              100 * progress + "%";

        }

      ).then((unityInstance) => {

        /* Hide loading screen */

        document
          .querySelector("#unity-loading-bar")
          .style.display = "none";


        /* Fullscreen button */

        document
          .querySelector("#unity-fullscreen-button")
          .onclick = () => {

            unityInstance.SetFullscreen(1);

          };

      }).catch((message) => {

        console.error(message);

        unityShowBanner(
          "Unable to load Unity game: " + message,
          "error"
        );

      });

    };


    /* =========================================================
       ADD UNITY LOADER
    ========================================================= */

    document.body.appendChild(script);

  </script>

</body>
</html>
